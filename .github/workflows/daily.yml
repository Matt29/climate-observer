name: daily-build
on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC, après la mise à jour OISST/CPC
  workflow_dispatch:
concurrency: daily-build
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # un run normal prend ~5 min ; évite qu'une source bloquée consomme 6 h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4   # climatologies 1991-2020 (~1,8 Go, immuables) : clé fixe, sauvées une fois ; le reste (~250 Mo/j) est retéléchargé
        with:
          path: |
            cache/oisst/sst.day.mean.ltm.1991-2020.nc
            cache/cpc/tmax.day.ltm.1991-2020.nc
            cache/cpc/tmin.day.ltm.1991-2020.nc
          key: ltm-1991-2020-v1
      - run: python pipeline/build_data.py
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
      - run: python build_page.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages }
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
