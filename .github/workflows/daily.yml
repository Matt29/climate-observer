name: daily-build
on:
  schedule:
    # GitHub décale les crons de plusieurs heures (06:30 prévu -> 11-13 h UTC en sept. 2026) :
    # plusieurs déclenchements, le premier qui passe met à jour ; les suivants rattrapent une source en panne
    # et prennent le fichier CPC du jour (publié par PSL vers 15:40 UTC).
    - cron: "30 6 * * *"
    - cron: "30 10 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch:
concurrency: daily-build
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # un run normal prend ~5 min ; évite qu'une source bloquée consomme 6 h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4   # climatologies 1991-2020 (~1,8 Go, immuables) : clé fixe, sauvées une fois ; le reste (~250 Mo/j) est retéléchargé
        with:
          path: |
            cache/oisst/sst.day.mean.ltm.1991-2020.nc
            cache/cpc/tmax.day.ltm.1991-2020.nc
            cache/cpc/tmin.day.ltm.1991-2020.nc
          key: ltm-1991-2020-v1
      - uses: actions/cache@v4   # fichiers CPC de l'année (~115 Mo) : copie de secours si PSL est en panne ; clé tournante, restaure la plus récente
        with:
          path: cache/cpc/tm??.20??.nc
          key: cpc-year-${{ github.run_id }}
          restore-keys: cpc-year-
      - run: python pipeline/build_data.py
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
      - run: python build_page.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages }
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
